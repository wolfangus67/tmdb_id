<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMDB ID Finder (Sans Clé)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans" x-data="tmdbNoKeyFinder()">

    <div class="max-w-4xl mx-auto px-4 py-12">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 mb-2">
                TMDB ID Finder <span class="text-sm font-semibold bg-orange-500/20 text-orange-400 px-2 py-1 rounded ml-2">Sans Clé API</span>
            </h1>
            <p class="text-slate-400">Trouvez instantanément l'ID d'un film, d'une série, d'un artiste ou d'un genre sans configuration.</p>
        </header>

        <div class="flex border-b border-slate-700 mb-6 gap-2">
            <button @click="tab = 'search'" 
                    :class="tab === 'search' ? 'border-orange-500 text-orange-400' : 'border-transparent text-slate-400 hover:text-slate-200'"
                    class="py-2 px-4 border-b-2 font-medium text-sm transition">
                Films, Séries & Artistes
            </button>
            <button @click="tab = 'genres'" 
                    :class="tab === 'genres' ? 'border-orange-500 text-orange-400' : 'border-transparent text-slate-400 hover:text-slate-200'"
                    class="py-2 px-4 border-b-2 font-medium text-sm transition">
                Liste des Genres Static
            </button>
        </div>

        <div x-show="tab === 'search'">
            <div class="mb-8">
                <div class="relative">
                    <input type="text" 
                           x-model="query" 
                           @input.debounce.300ms="search()"
                           placeholder="Ex: Inception, Breaking Bad, Tarantino..." 
                           class="w-full bg-slate-800 border-2 border-slate-700 focus:border-orange-500 rounded-xl px-5 py-4 text-lg focus:outline-none shadow-lg transition">
                    <div x-show="loading" class="absolute right-4 top-4">
                        <svg class="animate-spin h-6 w-6 text-orange-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <template x-for="item in results" :key="item.id + '-' + item.media_type">
                    <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-4 flex gap-4 hover:border-slate-600 transition shadow-sm">
                        <div class="w-16 h-24 bg-slate-950 rounded overflow-hidden flex-shrink-0 flex items-center justify-center">
                            <template x-if="item.poster_path || item.profile_path">
                                <img :src="'https://image.tmdb.org/t/p/w92' + (item.poster_path || item.profile_path)" class="w-full h-full object-cover">
                            </template>
                            <template x-if="!item.poster_path && !item.profile_path">
                                <span class="text-xs text-slate-600">N/A</span>
                            </template>
                        </div>
                        <div class="flex flex-col justify-between flex-grow min-w-0">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded tracking-wide"
                                          :class="{
                                            'bg-blue-500/20 text-blue-400': item.media_type === 'movie',
                                            'bg-purple-500/20 text-purple-400': item.media_type === 'tv',
                                            'bg-amber-500/20 text-amber-400': item.media_type === 'person'
                                          }"
                                          x-text="item.media_type === 'movie' ? 'Film' : item.media_type === 'tv' ? 'Série' : 'Artiste'">
                                    </span>
                                    <span class="text-xs text-slate-400 truncate" x-text="item.release_date || item.first_air_date"></span>
                                </div>
                                <h3 class="font-bold text-slate-100 truncate text-base" :title="item.title || item.name" x-text="item.title || item.name"></h3>
                            </div>
                            <div class="flex items-center justify-between bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700/50 mt-2">
                                <code class="text-sm font-mono font-bold text-orange-400" x-text="item.id"></code>
                                <button @click="copyToClipboard(item.id, $event)" class="text-xs text-slate-400 hover:text-slate-200 transition">
                                    <span>Copier</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <div x-show="tab === 'genres'">
            <div class="mb-6">
                <input type="text" 
                       x-model="genreQuery" 
                       placeholder="Filtrer les genres..." 
                       class="w-full bg-slate-800 border-2 border-slate-700 focus:border-orange-500 rounded-xl px-5 py-3 text-base focus:outline-none shadow-lg transition">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <template x-for="genre in filteredGenres" :key="genre.id + '-' + genre.type">
                    <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-4 flex flex-col justify-between hover:border-slate-600 transition shadow-sm">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-bold text-slate-100 text-base" x-text="genre.name"></h3>
                            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded tracking-wide"
                                  :class="genre.type === 'movie' ? 'bg-blue-500/20 text-blue-400' : 'bg-purple-500/20 text-purple-400'"
                                  x-text="genre.type === 'movie' ? 'Film' : 'Série'">
                            </span>
                        </div>
                        <div class="flex items-center justify-between bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700/50">
                            <code class="text-sm font-mono font-bold text-emerald-400" x-text="genre.id"></code>
                            <button @click="copyToClipboard(genre.id, $event)" class="text-xs text-slate-400 hover:text-slate-200 transition">
                                <span>Copier</span>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        function tmdbNoKeyFinder() {
            return {
                tab: 'search',
                query: '',
                genreQuery: '',
                results: [],
                loading: false,
                // Liste officielle et fixe des genres TMDB en français pour s'affranchir de l'API
                genresList: [
                    {id: 28, name: "Action", type: "movie"}, {id: 12, name: "Aventure", type: "movie"}, {id: 16, name: "Animation", type: "movie"},
                    {id: 35, name: "Comédie", type: "movie"}, {id: 80, name: "Crime", type: "movie"}, {id: 99, name: "Documentaire", type: "movie"},
                    {id: 18, name: "Drame", type: "movie"}, {id: 10751, name: "Familial", type: "movie"}, {id: 14, name: "Fantastique", type: "movie"},
                    {id: 36, name: "Histoire", type: "movie"}, {id: 27, name: "Horreur", type: "movie"}, {id: 10402, name: "Musique", type: "movie"},
                    {id: 9648, name: "Mystère", type: "movie"}, {id: 10749, name: "Romance", type: "movie"}, {id: 878, name: "Science-Fiction", type: "movie"},
                    {id: 10770, name: "Téléfilm", type: "movie"}, {id: 53, name: "Thriller", type: "movie"}, {id: 10752, name: "Guerre", type: "movie"},
                    {id: 37, name: "Western", type: "movie"}, {id: 10759, name: "Action & Aventure", type: "tv"}, {id: 16, name: "Animation", type: "tv"},
                    {id: 35, name: "Comédie", type: "tv"}, {id: 80, name: "Crime", type: "tv"}, {id: 99, name: "Documentaire", type: "tv"},
                    {id: 18, name: "Drame", type: "tv"}, {id: 10751, name: "Familial", type: "tv"}, {id: 10762, name: "Kids", type: "tv"},
                    {id: 9648, name: "Mystère", type: "tv"}, {id: 10763, name: "News", type: "tv"}, {id: 10764, name: "Reality", type: "tv"},
                    {id: 10765, name: "Sci-Fi & Fantasy", type: "tv"}, {id: 10766, name: "Soap", type: "tv"}, {id: 10767, name: "Talk", type: "tv"},
                    {id: 10768, name: "War & Politics", type: "tv"}, {id: 37, name: "Western", type: "tv"}
                ],

                async search() {
                    if (!this.query.trim()) { this.results = []; return; }
                    this.loading = true;

                    try {
                        // Utilisation d'un proxy CORS + API interne publique de TMDB
                        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://api.themoviedb.org/3/search/multi?api_key=844dba0bfd18b2a608e6e225e9e14e1c&language=fr-FR&query=' + this.query)}`);
                        const data = await response.json();
                        const tmdbData = JSON.parse(data.contents);
                        
                        this.results = tmdbData.results.filter(i => ['movie', 'tv', 'person'].includes(i.media_type));
                    } catch (err) {
                        console.error(err);
                        this.results = [];
                    } finally {
                        this.loading = false;
                    }
                },

                get filteredGenres() {
                    if (!this.genreQuery.trim()) return this.genresList;
                    return this.genresList.filter(g => g.name.toLowerCase().includes(this.genreQuery.toLowerCase()));
                },

                copyToClipboard(id, event) {
                    navigator.clipboard.writeText(id).then(() => {
                        const btn = event.currentTarget;
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '<span class="text-green-400 font-medium">Copié !</span>';
                        setTimeout(() => { btn.innerHTML = originalText; }, 1500);
                    });
                }
            }
        }
    </script>
</body>
</html>
